/*
 * importer 
 
 	Build Runnable Jar for Importer
 
 		defaultTasks 'shadowJar'
 *
 */

/*
    Build executable jar file with gradle shadowJar
    More info at: https://imperceptiblethoughts.com/shadow/
    
    Requires Gradle 5+
 */

	//  http://ajoberstar.org/grgit/grgit-gradle.html
	// Grgit: Generally, you should only apply the plugin to the root project of your build.
	//  Plugin adds grgit property to your build, which is an instance of Grgit.
	//     Plugin looks for .git directory in build directory and it's parents
 
buildscript {
  repositories {
    maven {
      url "https://plugins.gradle.org/m2/"
    }
  }
  dependencies {
    classpath "org.ajoberstar.grgit:grgit-gradle:5.3.3"
  }
}

plugins {
	id 'com.gradleup.shadow' version '9.4.2'
	//  moved to 'buildscript'. See Notes above	id 'org.ajoberstar.grgit' version '3.1.1'
}

apply plugin: 'java'

apply plugin: "org.ajoberstar.grgit"

//  Java 25 via toolchain (Gradle 9 + JDK 25)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()

    //  Published proxl-import-api jar (git-based Maven repo on the 'repository' branch)
    maven {
        url 'https://raw.githubusercontent.com/yeastrc/proxl-import-api/repository/'
    }
}

//  Set default task for this build.gradle file
defaultTasks 'shadowJar'


configurations.all {
	//  Exclude default logger for Spring Boot 'logback'
   exclude group:"ch.qos.logback", module:"logback-core"
   exclude group:"ch.qos.logback", module:"logback-classic"
   	//  Exclude Routing of log4j to slf4j since using opposite (slf4j to log4j) and including this would create a circular reference
   exclude group:'org.apache.logging.log4j', module: 'log4j-to-slf4j'
//   exclude group:'org.apache.logging.log4j', module: 'log4j-api'
}

//  Proxl Import API version - single source of truth at the repo root, so bumping the version
//  touches one file and the webapp + importer modules stay in lockstep.
String proxl_import_api_version = project.file('../Gradle_proxl-import-api_version_for_Gradle.txt').getText('UTF-8').trim()
String proxl_import_api = 'org.yeastrc:proxl-import-api:' + proxl_import_api_version
println("compile for 'org.yeastrc:proxl-import-api': " + proxl_import_api)

dependencies {
	

	//  Specify dependency on Proxl Shared Code
	
	implementation project(":proxl-shared-code")

	//  Specify dependency on proxl_importer_run_importer_shared

	implementation project(":proxl_importer_run_importer_shared")

	/////////////////////////////////////
	
	//  New StringUtils
	// https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
	implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.20.0'
	
	// https://mvnrepository.com/artifact/org.apache.commons/commons-dbcp2
	implementation group: 'org.apache.commons', name: 'commons-dbcp2', version: '2.14.0'
	
	// https://mvnrepository.com/artifact/com.mysql/mysql-connector-j
	implementation group: 'com.mysql', name: 'mysql-connector-j', version: '9.7.0'
	
	
	//  Logging
	
	implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.26.0'
	implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.26.0'	
	
	// https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-slf4j-impl
	implementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j-impl', version: '2.26.0'
	
	//  Jakarta Commons Logging to SLF4J
	implementation group: 'org.slf4j', name: 'jcl-over-slf4j', version: '2.0.18'
	
	//  Log4j 1 to 2 bridge
	implementation group: 'org.apache.logging.log4j', name: 'log4j-1.2-api', version: '2.26.0'
		
		
		
	// https://mvnrepository.com/artifact/joda-time/joda-time
	implementation group: 'joda-time', name: 'joda-time', version: '2.14.2'
	
	
	
	
	// JAXB 4.0 (jakarta.xml.bind) - the deserializer runtime. A 4.0 runtime binds both the
	// published proxl-import-api jakarta classes (built at JAXB 3.0) and the local jakarta
	// RunImporterToImporterFile classes.
	// https://mvnrepository.com/artifact/jakarta.xml.bind/jakarta.xml.bind-api
	implementation group: 'jakarta.xml.bind', name: 'jakarta.xml.bind-api', version: '4.0.5'
	// https://mvnrepository.com/artifact/org.glassfish.jaxb/jaxb-runtime
	implementation group: 'org.glassfish.jaxb', name: 'jaxb-runtime', version: '4.0.9'

	//  jakarta-only now: the bundled spectral-storage accept-import connector jar went jakarta in
	//  spectral-storage v2.0.0, so the previous javax JAXB 2 coexistence (javax.xml.bind:jaxb-api +
	//  com.sun.xml.bind:jaxb-impl) was removed.

	//  Proxl Import API (Proxl XML JAXB classes) - pulled from the published jakarta jar
	//  instead of a bundled jar under libs_proxl_github_jars.
	implementation proxl_import_api
	
	
	

	//  NOT FOUND  either jcenter() or mavenCentral()
	
	//     Took Gradle listing from https://mvnrepository.com/artifact/jargs/jargs/1.0
    // https://mvnrepository.com/artifact/jargs/jargs
//	implementation group: 'jargs', name: 'jargs', version: '1.0'

	//////////////////////////////
	
	//  (proxl-import-api now comes from the published Maven jar above, not libs_proxl_github_jars)

	//   jargs.jar
	implementation fileTree(dir: '../lib_importer_run_importer__and_importer_run_importer_shared_code', include: ['*.jar'])
	
	//  Jars from other Yeastrc projects
	implementation fileTree(dir: 'lib_spectal_storage_client_connector_code', include: ['*.jar'])
	
}


//  Assign to grgit, created by plugin
def gitRepo = grgit


// def gitRepo = Grgit.open({
//  dir = ".."  //  Use parent directory since that is root of GIT repo
//  currentDir = <path>
//  credentials = <credentals>
// })

def gitHeadId = gitRepo.head().id
def gitCommit = gitRepo.head().getAbbreviatedId(8)
def gitBranch = gitRepo.branch.getCurrent().getName()

//  Get tag at GIT HEAD: like git tag --points-at HEAD
def repoHead = gitRepo.head()
def repoHeadTag = gitRepo.tag.list().find {
	it.commit == repoHead
}
def repoTagName = "NO GIT Tag at HEAD"

if ( repoHeadTag ) {
	println("GIT Tag at HEAD found")
	repoTagName = repoHeadTag.getName()
}


println("gitHeadId: " + gitHeadId )
println("gitCommit: " + gitCommit )
println("gitBranch: " + gitBranch )
println("GIT Tag at HEAD: " + repoTagName )

jar {
    manifest {
        attributes 'Main-Class': 'org.yeastrc.proxl.import_xml_to_db.program_default.ImporterDefaultMainProgramEntry'
        attributes([ 'Project-Title': project.name,
					'Build-Timestamp': new Date().format("yyyy-MM-dd HH:mm:ssZ"),
					'Git-Commit': gitCommit,
					'GIT-Full-HASH': gitHeadId,
					'GIT-Tag-at-HEAD': repoTagName,
					'Git-Branch': gitBranch ])
    }
}

//  NOT NEEDED:  files from 'src/main/resources' copied to resulting jar without this.

//  For creating runnable jar
//  processResources {
//    from ('src/main/resources') {
//        include '**/*'
//    }
// }

//   https://imperceptiblethoughts.com/shadow/configuration/#configuring-output-name

shadowJar {

    archiveBaseName = 'importProxlXML'
    
    // Required to output same as previous filename. 
    //		Default is 'all' which will add '-all' to output filename before '.jar'
    
    archiveClassifier = '' 
    
    //  Default is empty string 
    archiveVersion = ''
    
    //  For Log4J2
    transform(com.github.jengelman.gradle.plugins.shadow.transformers.Log4j2PluginsCacheFileTransformer)
}
