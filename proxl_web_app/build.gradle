	//  http://ajoberstar.org/grgit/grgit-gradle.html
	// Grgit: Generally, you should only apply the plugin to the root project of your build.
	//  Plugin adds grgit property to your build, which is an instance of Grgit.
	//     Plugin looks for .git directory in build directory and it's parents
 
buildscript {
  repositories {
    maven {
      url "https://plugins.gradle.org/m2/"
    }
  }
  dependencies {
    classpath "org.ajoberstar.grgit:grgit-gradle:5.3.3"
  }
}

plugins {
	id 'java'
	id 'war'
	id 'eclipse'
    id 'eclipse-wtp' //  Required to manipulate Eclipse Web Tools Platform settings
//	id "org.springframework.boot" version "2.0.1.RELEASE"
//	id "io.spring.dependency-management" version "1.0.5.RELEASE"
	//  moved to 'buildscript'. See Notes above	id 'org.ajoberstar.grgit' version '3.1.1'
}

//  Eclipse WTP facets - pin jst.web to 6.0 even though the code compiles against Servlet 6.1

eclipse {
    wtp {
        facet {
            // Pin Eclipse's WTP facets to Dynamic Web Module 6.0 + Java 25, even though the
            // project compiles against Servlet 6.1 (jakarta.servlet-api:6.1.0). Eclipse WTP has
            // no validation support for Servlet 6.1 yet, so targeting 6.1 triggers import errors;
            // 6.0 is the newest facet Eclipse accepts, and Tomcat 11 (Servlet 6.1) runs a
            // 6.0-configured project fine.
            //
            // The eclipse-wtp plugin auto-injects a jst.web facet derived from the
            // jakarta.servlet-api version (i.e. jst.web 6.1 from the 6.1.0 dep) AFTER this block
            // evaluates, so filtering 'facets' here does nothing. Instead, add the versions we
            // want and strip the wrong-version duplicates at merge time (which runs last). Guard
            // on version != null so the '<fixed facet="jst.java"/>' entry is preserved.
            facet name: 'jst.web',  version: '6.0'
            facet name: 'jst.java', version: '25'
            file {
                whenMerged { wtpFacet ->
                    wtpFacet.facets.removeAll {
                        it.version != null &&
                        ( (it.name == 'jst.web'  && it.version != '6.0') ||
                          (it.name == 'jst.java' && it.version != '25') )
                    }
                }
            }
        }
    }
}

apply plugin: "org.ajoberstar.grgit"

repositories {
    mavenCentral()

    //  Eclipse ImageN (successor to JAI) is published to the OSGeo Nexus repo, not Maven Central
    maven {
        url "https://repo.osgeo.org/repository/release/"
    }

    //  Published proxl-import-api jar (git-based Maven repo on the 'repository' branch)
    maven {
        url 'https://raw.githubusercontent.com/yeastrc/proxl-import-api/repository/'
    }
}

//  Default Task
//    Comment out since creates infinite loop of building
//  defaultTasks 'build'

//  Java 25 via toolchain (Gradle 9 + JDK 25)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations.all {
//  Need all these excludes if using Spring Boot
	//  Exclude default logger for Spring Boot 'logback'
   exclude group:"ch.qos.logback", module:"logback-core"
   exclude group:"ch.qos.logback", module:"logback-classic"
   	//  Exclude Routing of log4j to slf4j since using opposite (slf4j to log4j) and including this would create a circular reference
   exclude group:'org.apache.logging.log4j', module: 'log4j-to-slf4j'
//   exclude group:'org.apache.logging.log4j', module: 'log4j-api'

}

//  Proxl Import API version - single source of truth at the repo root, so bumping the version
//  touches one file and the webapp + importer modules stay in lockstep.
String proxl_import_api_version = project.file('../Gradle_proxl-import-api_version_for_Gradle.txt').getText('UTF-8').trim()
String proxl_import_api = 'org.yeastrc:proxl-import-api:' + proxl_import_api_version
println("compile for 'org.yeastrc:proxl-import-api': " + proxl_import_api)

dependencies {

	//  Specify dependency on Proxl Shared Code
	
	implementation project(":proxl-shared-code") //  !! See Dependencies of proxl-shared-code
	
	/////////////////////////////////////
	
	
	//  Jersey Server for webservices
	
	
	// https://mvnrepository.com/artifact/org.glassfish.jersey.core/jersey-server
	implementation group: 'org.glassfish.jersey.core', name: 'jersey-server', version: '4.0.2'
	
	//  Jersey 4.0 dropped 'jersey-container-servlet-core'; use 'jersey-container-servlet'
	//  (full servlet integration, incl. web.xml / annotation-based registration).
	// https://mvnrepository.com/artifact/org.glassfish.jersey.containers/jersey-container-servlet
	implementation group: 'org.glassfish.jersey.containers', name: 'jersey-container-servlet', version: '4.0.2'
	
	// https://mvnrepository.com/artifact/org.glassfish.jersey.inject/jersey-hk2
	implementation group: 'org.glassfish.jersey.inject', name: 'jersey-hk2', version: '4.0.2'
	
	
	// https://mvnrepository.com/artifact/org.glassfish.jersey.media/jersey-media-json-jackson
	implementation group: 'org.glassfish.jersey.media', name: 'jersey-media-json-jackson', version: '4.0.2'
	
	//  Image processing (Eclipse ImageN - replaces the removed Java Advanced Imaging / JAI jars)

	//  Eclipse ImageN (maintained successor to JAI) - provides the image 'scale' op for the MS1 intensity heatmap.
	//  Replaces the legacy javax.media.jai JARs, which reached into JDK-internal sun.awt.image classes
	//  and break under Java 9+ strong module encapsulation (the QC MS1 heatmap threw on Java 17+).
	//  Must use 'imagen-all' (shaded uber-jar containing the operators); 'imagen' is a pom-only parent with no classes.
	//  ImageN 0.9.1 is Java 17 bytecode, which is fine on this project's Java 25 toolchain.
	implementation 'org.eclipse.imagen:imagen-all:0.9.1'


	//  Mail
	
	// Jakarta Mail (jakarta.mail namespace) - API + Angus implementation
	// https://mvnrepository.com/artifact/jakarta.mail/jakarta.mail-api
	implementation group: 'jakarta.mail', name: 'jakarta.mail-api', version: '2.1.3'
	// https://mvnrepository.com/artifact/org.eclipse.angus/angus-mail
	implementation group: 'org.eclipse.angus', name: 'angus-mail', version: '2.0.3'
	

	// https://mvnrepository.com/artifact/org.apache.commons/commons-dbcp2
	implementation group: 'org.apache.commons', name: 'commons-dbcp2', version: '2.2.0'
	
	
	
	//  Logging Log4j Version 2
	
	implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.25.4'
	implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.25.4'
	implementation group: 'org.apache.logging.log4j', name: 'log4j-web', version: '2.25.4' //  Needed for Web app
	
	// https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-slf4j-impl
	implementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j-impl', version: '2.25.4'
	
	//  Jakarta Commons Logging to SLF4J
	implementation group: 'org.slf4j', name: 'jcl-over-slf4j', version: '1.7.25'
	
	//  Log4j 1 to 2 bridge
	implementation group: 'org.apache.logging.log4j', name: 'log4j-1.2-api', version: '2.25.4'
		
	
	//  redirects log4j to slf4j, the opposite of how logging is set up
	// https://mvnrepository.com/artifact/org.slf4j/log4j-over-slf4j
//	implementation group: 'org.slf4j', name: 'log4j-over-slf4j', version: '1.7.25'

	
	// Used by included yeastrc jar password management
	// https://mvnrepository.com/artifact/org.springframework.security/spring-security-crypto
	implementation group: 'org.springframework.security', name: 'spring-security-crypto', version: '7.0.6'
	
	// Jakarta JSTL (jakarta.tags.* taglibs) - API + Glassfish implementation
	// https://mvnrepository.com/artifact/jakarta.servlet.jsp.jstl/jakarta.servlet.jsp.jstl-api
	implementation group: 'jakarta.servlet.jsp.jstl', name: 'jakarta.servlet.jsp.jstl-api', version: '3.0.0'
	// https://mvnrepository.com/artifact/org.glassfish.web/jakarta.servlet.jsp.jstl
	implementation group: 'org.glassfish.web', name: 'jakarta.servlet.jsp.jstl', version: '3.0.1'
	
	
	//   Apache Commons
	
	//  StringUtils
	// https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
	implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.18.0'
	
	// https://mvnrepository.com/artifact/commons-io/commons-io
	implementation group: 'commons-io', name: 'commons-io', version: '2.18.0'
	
	// https://mvnrepository.com/artifact/org.apache.commons/commons-math3
	implementation group: 'org.apache.commons', name: 'commons-math3', version: '3.6.1'
	
	
	//   Apache HTPP Client

	// https://mvnrepository.com/artifact/org.apache.httpcomponents/httpclient
	implementation group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5.14' // Was using 4.1.2

	// https://mvnrepository.com/artifact/org.apache.httpcomponents/httpcore
	implementation group: 'org.apache.httpcomponents', name: 'httpcore', version: '4.4.16' // Was using 4.1.2
 	
	
	// https://mvnrepository.com/artifact/com.google.guava/guava
	implementation group: 'com.google.guava', name: 'guava', version: '27.1-jre'
	
	// https://mvnrepository.com/artifact/joda-time/joda-time
	implementation group: 'joda-time', name: 'joda-time', version: '2.10.2'
	
	//  Jackson JSON parsing
	
	// https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-core
	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.22.1'
	
	// https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-databind
	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.22.1'

	//  Jackson Joda-Time datatype module. Jackson 2.x (pulled to 2.18.x by Jersey 3.1) does NOT
	//  serialize org.joda.time types by default; several DTOs expose org.joda.time.DateTime (e.g.
	//  PDBFileDTO.uploadDate). Registered with the JAX-RS ObjectMapper via ObjectMapperContextResolver.
	// https://mvnrepository.com/artifact/com.fasterxml.jackson.datatype/jackson-datatype-joda
	implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-joda', version: '2.22.0'

	//  BioJava
	
		//  version 5 exists for all jars:  https://mvnrepository.com/artifact/org.biojava/
		
	// https://mvnrepository.com/artifact/org.biojava/biojava-core
	implementation group: 'org.biojava', name: 'biojava-core', version: '4.2.12'
	
	// https://mvnrepository.com/artifact/org.biojava/biojava-structure
	implementation group: 'org.biojava', name: 'biojava-structure', version: '4.2.12'
	
	// https://mvnrepository.com/artifact/org.biojava/biojava-alignment
	implementation group: 'org.biojava', name: 'biojava-alignment', version: '4.2.12'
	
	
	//  Spring Web MVC (5.3.x - last 'javax.*' / Servlet 3.1+ line; replacing Struts incrementally)
	//  Brings in spring-web, spring-context, spring-beans, spring-core, spring-expression, spring-aop transitively.
	// https://mvnrepository.com/artifact/org.springframework/spring-webmvc
	implementation group: 'org.springframework', name: 'spring-webmvc', version: '7.0.8'



	// JAXB coexistence (javax.xml.bind + jakarta.xml.bind on the same webapp classpath).
	// BOTH runtimes are needed: javax for the precompiled yeastrc/proxl jars + this app's own
	// javax.xml.bind code; jakarta for the jakarta client connectors (spectral-storage get-data,
	// etc.) that call jakarta.xml.bind.JAXBContext.newInstance(...).
	// They must live on DISTINCT maven coordinates. The javax runtime and the jakarta runtime
	// BOTH ship as 'org.glassfish.jaxb:jaxb-runtime' (javax = 2.3.x, jakarta = 4.0.x), so using
	// that coordinate for javax makes Gradle resolve the module to a single version and one side
	// loses its runtime (here: 2.3.1 won, leaving the jakarta connectors with NO jakarta runtime
	// -> JAXBContext.newInstance NPEs). Put javax on the com.sun.xml.bind:jaxb-impl coordinate
	// instead, leaving org.glassfish.jaxb:jaxb-runtime free for the jakarta 4.x runtime:
	//   javax   = javax.xml.bind:jaxb-api         + com.sun.xml.bind:jaxb-impl    (2.3.x)
	//   jakarta = jakarta.xml.bind-api (via Jersey) + org.glassfish.jaxb:jaxb-runtime (4.0.x)
	// https://mvnrepository.com/artifact/javax.xml.bind/jaxb-api
	implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.1'
	// https://mvnrepository.com/artifact/com.sun.xml.bind/jaxb-impl  (javax runtime)
	implementation group: 'com.sun.xml.bind', name: 'jaxb-impl', version: '2.3.1'
	// https://mvnrepository.com/artifact/org.glassfish.jaxb/jaxb-runtime  (jakarta runtime)
	implementation group: 'org.glassfish.jaxb', name: 'jaxb-runtime', version: '4.0.5'
	
	
	
		///////////
		
	//  Proxl Import API - pulled from the published jar (jakarta, v2.x) instead of a bundled jar.
	//  The webapp uses only the XSD_ElementAttributeNamesConstants class (StAX validation of the
	//  start of an uploaded Proxl XML file); it does not JAXB-bind any Proxl Import API class, so
	//  no jakarta JAXB runtime is needed here for it.
	implementation proxl_import_api

	//  Other Yeastrc Jars
	
	//  Jars built from other Yeastrc Github repositories - Webapp only	
	implementation fileTree(dir: 'libs_webapp__yeastrc_github_jars', include: ['*.jar'])
	
	
	
	
	
    // https://mvnrepository.com/artifact/org.apache.tomcat.embed/tomcat-embed-core
    providedCompile group: 'org.apache.tomcat.embed', name: 'tomcat-embed-core', version: '11.0.22'

	//  
	// Jakarta Servlet 6.1 (Jakarta EE 11) - provided by the Tomcat 11 container.
	// Code compiles against Servlet 6.1, but the Eclipse WTP facet is pinned to jst.web 6.0
	// (see the eclipse{} block above) because Eclipse WTP has no Servlet 6.1 validation yet;
	// Tomcat 11 (Servlet 6.1) runs a 6.0-configured project fine.
	// https://mvnrepository.com/artifact/jakarta.servlet/jakarta.servlet-api
	providedCompile group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '6.1.0'

	// Jakarta Server Pages 4.0 (Jakarta EE 11) - matches Servlet 6.1; provided by Tomcat 11.
	// https://mvnrepository.com/artifact/jakarta.servlet.jsp/jakarta.servlet.jsp-api
	providedCompile group: 'jakarta.servlet.jsp', name: 'jakarta.servlet.jsp-api', version: '4.0.0'
	
}

