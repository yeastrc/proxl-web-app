version: 2

# Dependabot VERSION-UPDATE PRs.
#
# Security ALERTS for the Gradle modules come from the dependency graph submitted by
# .github/workflows/dependency-submission.yml (GitHub does not auto-parse build.gradle).
# This file additionally opens scheduled PRs to bump DIRECT dependencies that are behind.

updates:
  # ---- npm: front end ----
  - package-ecosystem: "npm"
    directory: "/proxl_web_app/front_end"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Batch all available updates into ONE PR (per directory) instead of one PR
    # per dependency, to avoid a flood of PRs.
    groups:
      npm-dependencies:
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ---- Gradle: JVM modules with declared dependencies (front_end builds no Java) ----
  - package-ecosystem: "gradle"
    directories:
      - "/proxl_web_app"
      - "/proxl-shared-code"
      - "/proxl_importer"
      - "/proxl_importer_run_importer_shared"
      - "/proxl_run_importer"
      - "/proxl_submit_import"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Batch all available updates into ONE PR per module directory instead of one
    # PR per dependency.
    groups:
      gradle-dependencies:
        patterns:
          - "*"
      gradle-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ---- GitHub Actions used by the workflows ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
