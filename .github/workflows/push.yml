name: Proxl Build CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Gradle sees both JDKs (8 and 25)
      uses: docker://ghcr.io/yeastrc/proxl-build-docker:latest
      with:
        entrypoint: ./proxl_submit_import/gradlew
        args: -p proxl_submit_import -q javaToolchains
    - name: Run build in Docker container	    
      uses: docker://ghcr.io/yeastrc/proxl-build-docker:latest
      with:
        entrypoint: ant
        args: -f ant__build_all_proxl.xml
