/*
 *  Application 'shared-code' folder
 *
 * This file was generated by the Gradle 'init' task.
 *
 * This generated file contains a sample Java Library project to get you started.
 * For more details take a look at the Java Libraries chapter in the Gradle
 * user guide available at https://docs.gradle.org/4.5/userguide/java_library_plugin.html
 */

plugins {
    // Apply the java-library plugin to add support for Java Library
    id 'java-library'
}

//  Java 25 via toolchain (Gradle 9 + JDK 25)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}


dependencies {

//  Specify dependency on Proxl Shared Code
	
	implementation project(":proxl-shared-code")
	
	// https://mvnrepository.com/artifact/org.slf4j/slf4j-simple
	compileOnly group: 'org.slf4j', name: 'slf4j-api', version: '1.7.25'

	//  New StringUtils
	// https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
	compileOnly group: 'org.apache.commons', name: 'commons-lang3', version: '3.9'
	
	
	// https://mvnrepository.com/artifact/org.apache.commons/commons-dbcp2
	compileOnly group: 'org.apache.commons', name: 'commons-dbcp2', version: '2.2.0'
	
	// JAXB 4.0 (jakarta.xml.bind) - compile-time annotations for the RunImporterToImporterFile
	// JAXB classes; the runtime is provided by the consuming modules (importer / run_importer).
	// https://mvnrepository.com/artifact/jakarta.xml.bind/jakarta.xml.bind-api
	compileOnly group: 'jakarta.xml.bind', name: 'jakarta.xml.bind-api', version: '4.0.2'
	// https://mvnrepository.com/artifact/org.glassfish.jaxb/jaxb-runtime
	compileOnly group: 'org.glassfish.jaxb', name: 'jaxb-runtime', version: '4.0.5'
	
}

// In this section you declare where to find the dependencies of your project
repositories {
    mavenCentral()
}
